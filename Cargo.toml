[workspace]
resolver = "3"
members = [
    "crates/skillforge-cli",
    "crates/skillforge-core",
    "crates/skillforge-runtime",
    "crates/skillforge-mcp",
]
exclude = ["skills/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/chasebilling/skillforge"

[workspace.dependencies]
skillforge-core    = { path = "crates/skillforge-core", version = "0.1.0" }
skillforge-runtime = { path = "crates/skillforge-runtime", version = "0.1.0" }
skillforge-mcp     = { path = "crates/skillforge-mcp", version = "0.1.0" }

anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
toml       = "0.9"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = "z"
